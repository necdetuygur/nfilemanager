<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nFileManager</title>
    <link id="dynamic-favicon" rel="icon" type="image/png" href="">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="top-bar">
        <span class="top-bar-title">📁 nFileManager</span>
        <select id="langSelect" class="lang-select" data-i18n-options="turkish,english">
          <option value="tr">🇹🇷 Türkçe</option>
          <option value="en">🇬🇧 English</option>
        </select>
      </div>

      <div id="progressContainer" class="progress-container" style="display:none">
        <div class="progress-bar">
          <div id="progressBar" class="progress-fill"></div>
        </div>
        <div class="progress-info">
          <span id="progressPercent">0%</span>
          <span id="progressSize">0 MB / 0 MB</span>
        </div>
      </div>

      <div class="files-section">
        <div class="sticky-header">
          <div class="search-row">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Ara..." data-i18n-placeholder="search" />
          </div>

          <div id="toolbar" class="toolbar">
            <button id="backBtn" class="btn btn-secondary toolbar-btn" style="display:none" data-i18n="parentDir">⬆️ Üst Dizin</button>
            <button class="btn btn-primary toolbar-btn" onclick="window.createFile()" data-i18n="newFile">📄 New File</button>
            <button class="btn btn-primary toolbar-btn" onclick="window.createFolder()" data-i18n="newFolder">📁 New Folder</button>
            <button class="btn btn-warning toolbar-btn" id="renameBtn" onclick="window.renameSelected()" disabled data-i18n="rename">✏️ Rename</button>
            <button class="btn btn-info toolbar-btn" id="editBtn" onclick="window.editSelected()" disabled data-i18n="edit">✏️ Edit</button>
            <button class="btn btn-secondary toolbar-btn" id="moveBtn" onclick="window.moveSelected()" disabled data-i18n="move">📋 Move</button>
            <button class="btn btn-secondary toolbar-btn" id="copyBtn" onclick="window.copySelected()" disabled data-i18n="copy">📋 Copy</button>
            <button class="btn btn-view toolbar-btn" id="viewBtn" onclick="window.viewSelected()" disabled data-i18n="view">👁️ View</button>
            <button class="btn btn-info toolbar-btn" id="downloadBtn" onclick="window.downloadSelected()" disabled data-i18n="download">⬇️ Download</button>
            <button class="btn btn-danger toolbar-btn" id="removeBtn" onclick="window.removeSelected()" disabled data-i18n="remove">🗑️ Remove</button>
          </div>

          <div id="breadcrumb" class="breadcrumb"></div>
        </div>

        <div class="sort-header">
          <input type="checkbox" id="selectAllCheckbox" class="file-checkbox" title="Select All">
          <span class="sort-btn active" data-sort="name" data-i18n="name">Ad ▲</span>
          <span class="sort-btn" data-sort="size" data-i18n="size">Boyut</span>
          <span class="sort-btn" data-sort="type" data-i18n="type">Tür</span>
          <span class="sort-btn" data-sort="date" data-i18n="date">Tarih</span>
          <button id="refreshBtn" class="btn sort-refresh-btn" data-i18n="refresh">🔄 Yenile</button>
        </div>

        <div id="filesList" class="files-list"></div>
      </div>

      <div class="upload-section">
        <div class="upload-box">
          <input type="file" id="fileInput" hidden />
          <button id="selectBtn" class="btn btn-primary" data-i18n="selectFile">📄 Dosya Seç</button>
          <span id="fileName" data-i18n="noFileSelected">Seçili dosya yok</span>
        </div>
        <button id="uploadBtn" class="btn btn-success" disabled data-i18n="upload">Yükle</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
