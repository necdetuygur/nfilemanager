<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nFileManager - Editor</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div class="container editor-container">
      <div class="editor-header">
        <h2 id="editorTitle">📝 Text Editor</h2>
        <button id="backBtn" class="btn btn-secondary">⬅️ Back to Files</button>
      </div>
      <div class="editor-body">
        <textarea id="editorContent" spellcheck="false"></textarea>
      </div>
      <div class="editor-footer">
        <div id="editorStatus" class="editor-status"></div>
        <div class="editor-actions">
          <button id="saveBtn" class="btn btn-success">💾 Save</button>
          <button id="cancelBtn" class="btn btn-danger">✖ Cancel</button>
        </div>
      </div>
    </div>
    <script src="editor.js"></script>
  </body>
</html>
